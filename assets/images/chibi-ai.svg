<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="100%" height="100%">
  <defs>
    <radialGradient id="faceGradAi" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="85%" stop-color="#FFE0B2"/>
      <stop offset="100%" stop-color="#FFCC80"/>
    </radialGradient>
    <linearGradient id="uniformGradAi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="50%" stop-color="#1B5E20"/>
      <stop offset="100%" stop-color="#0F4214"/>
    </linearGradient>
    <linearGradient id="capGradAi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#388E3C"/>
      <stop offset="70%" stop-color="#1B5E20"/>
      <stop offset="100%" stop-color="#144217"/>
    </linearGradient>
    <linearGradient id="aiCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="goldAccAi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <filter id="aiGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Shadow Under Mascot -->
  <ellipse cx="120" cy="265" rx="65" ry="12" fill="#000000" opacity="0.18"/>

  <!-- Body / Uniform -->
  <g id="bodyGroup">
    <rect x="95" y="220" width="20" height="35" rx="5" fill="#1B5E20"/>
    <rect x="125" y="220" width="20" height="35" rx="5" fill="#1B5E20"/>
    <path d="M 90 245 L 118 245 C 118 255, 114 260, 92 260 C 86 260, 86 250, 90 245 Z" fill="#212121"/>
    <path d="M 122 245 L 150 245 C 154 250, 154 260, 148 260 C 126 260, 122 255, 122 245 Z" fill="#212121"/>

    <path d="M 75 160 Q 120 152 165 160 L 170 225 Q 120 230 70 225 Z" fill="url(#uniformGradAi)"/>

    <rect x="74" y="208" width="92" height="12" rx="2" fill="#8D6E63"/>
    <rect x="110" y="206" width="20" height="16" rx="3" fill="url(#goldAccAi)" stroke="#B45309" stroke-width="1.5"/>

    <polygon points="76,162 92,158 90,172 74,174" fill="#DC2626" stroke="url(#goldAccAi)" stroke-width="1"/>
    <polygon points="164,162 148,158 150,172 166,174" fill="#DC2626" stroke="url(#goldAccAi)" stroke-width="1"/>

    <!-- Tie & Collar -->
    <polygon points="112,160 128,160 125,188 120,195 115,188" fill="#144217"/>
    <polygon points="102,156 120,165 112,160" fill="#FFFFFF"/>
    <polygon points="138,156 120,165 128,160" fill="#FFFFFF"/>
    <circle cx="120" cy="178" r="3" fill="url(#goldAccAi)"/>
    <circle cx="120" cy="192" r="3" fill="url(#goldAccAi)"/>

    <!-- Both hands holding a glowing AI Tablet -->
    <g transform="translate(68, 172)">
      <!-- Tablet Frame -->
      <rect x="0" y="0" width="104" height="48" rx="8" fill="#0F172A" stroke="url(#aiCyan)" stroke-width="2.5" filter="url(#aiGlow)"/>
      <rect x="4" y="4" width="96" height="40" rx="6" fill="#1E293B"/>
      <!-- Glowing waveform / chat lines -->
      <path d="M 12 24 Q 24 10 36 24 T 60 24 T 84 24" fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="20" cy="14" r="2.5" fill="#38BDF8"/>
      <circle cx="84" cy="34" r="2.5" fill="#38BDF8"/>
      <text x="52" y="36" font-size="7" font-weight="bold" fill="#38BDF8" text-anchor="middle" font-family="'Segoe UI', sans-serif">AI PHÁP LUẬT</text>
      <!-- Hands -->
      <circle cx="2" cy="24" r="9" fill="#FFE0B2"/>
      <circle cx="102" cy="24" r="9" fill="#FFE0B2"/>
    </g>
  </g>

  <!-- Big Cute Head -->
  <g id="headGroup">
    <circle cx="58" cy="108" r="14" fill="#FFE0B2"/>
    <circle cx="182" cy="108" r="14" fill="#FFE0B2"/>

    <ellipse cx="120" cy="108" rx="64" ry="54" fill="url(#faceGradAi)"/>

    <ellipse cx="78" cy="122" rx="12" ry="7" fill="#F87171" opacity="0.45"/>
    <ellipse cx="162" cy="122" rx="12" ry="7" fill="#F87171" opacity="0.45"/>

    <!-- Eyes with Sparkles -->
    <ellipse cx="92" cy="105" rx="14" ry="17" fill="#1F2937"/>
    <ellipse cx="88" cy="99" rx="6" ry="7" fill="#FFFFFF"/>
    <circle cx="97" cy="112" r="3.5" fill="#FFFFFF"/>
    <path d="M 80 88 Q 92 84 104 88" stroke="#374151" stroke-width="3" fill="none" stroke-linecap="round"/>

    <ellipse cx="148" cy="105" rx="14" ry="17" fill="#1F2937"/>
    <ellipse cx="144" cy="99" rx="6" ry="7" fill="#FFFFFF"/>
    <circle cx="153" cy="112" r="3.5" fill="#FFFFFF"/>
    <path d="M 136 88 Q 148 84 160 88" stroke="#374151" stroke-width="3" fill="none" stroke-linecap="round"/>

    <ellipse cx="120" cy="115" rx="2.5" ry="2" fill="#E28743"/>
    <path d="M 108 124 Q 120 140 132 124" fill="#EF4444" stroke="#B91C1C" stroke-width="1.5"/>
    <path d="M 112 126 Q 120 134 128 126" fill="#FCA5A5"/>

    <!-- Cap -->
    <path d="M 52 74 Q 120 54 188 74 C 182 86, 58 86, 52 74 Z" fill="#18181B"/>
    <path d="M 60 72 Q 120 58 180 72 L 178 58 Q 120 46 62 58 Z" fill="#DC2626"/>
    <path d="M 58 71 Q 120 57 182 71" stroke="url(#goldAccAi)" stroke-width="3" fill="none"/>
    <path d="M 45 48 C 50 15, 190 15, 195 48 C 175 62, 65 62, 45 48 Z" fill="url(#capGradAi)"/>
    <path d="M 50 44 C 70 22, 170 22, 190 44" stroke="url(#goldAccAi)" stroke-width="2.5" fill="none"/>
    <circle cx="120" cy="52" r="14" fill="#DC2626" stroke="url(#goldAccAi)" stroke-width="2"/>
    <polygon points="120,44 122,49 127,49 123,52 125,57 120,54 115,57 117,52 113,49 118,49" fill="url(#goldAccAi)"/>

    <!-- AI Headset & Mic -->
    <path d="M 54 100 A 70 70 0 0 1 186 100" fill="none" stroke="url(#aiCyan)" stroke-width="4.5" stroke-linecap="round"/>
    <rect x="46" y="94" width="12" height="24" rx="5" fill="#0891B2" stroke="#67E8F9" stroke-width="1.5"/>
    <rect x="182" y="94" width="12" height="24" rx="5" fill="#0891B2" stroke="#67E8F9" stroke-width="1.5"/>
    <!-- Mic Boom -->
    <path d="M 52 110 Q 75 140 100 134" fill="none" stroke="#0891B2" stroke-width="3" stroke-linecap="round"/>
    <circle cx="102" cy="134" r="5" fill="#22D3EE" filter="url(#aiGlow)"/>
  </g>
</svg>

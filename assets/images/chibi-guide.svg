<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="100%" height="100%">
  <defs>
    <radialGradient id="faceGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="85%" stop-color="#FFE0B2"/>
      <stop offset="100%" stop-color="#FFCC80"/>
    </radialGradient>
    <linearGradient id="uniformGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="50%" stop-color="#1B5E20"/>
      <stop offset="100%" stop-color="#0F4214"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#388E3C"/>
      <stop offset="70%" stop-color="#1B5E20"/>
      <stop offset="100%" stop-color="#144217"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Shadow Under Mascot -->
  <ellipse cx="120" cy="265" rx="65" ry="12" fill="#000000" opacity="0.18"/>

  <!-- Body / Uniform -->
  <g id="bodyGroup">
    <!-- Legs & Shoes -->
    <rect x="95" y="220" width="20" height="35" rx="5" fill="#1B5E20"/>
    <rect x="125" y="220" width="20" height="35" rx="5" fill="#1B5E20"/>
    <!-- Black Boots with glossy reflection -->
    <path d="M 90 245 L 118 245 C 118 255, 114 260, 92 260 C 86 260, 86 250, 90 245 Z" fill="#212121"/>
    <path d="M 122 245 L 150 245 C 154 250, 154 260, 148 260 C 126 260, 122 255, 122 245 Z" fill="#212121"/>

    <!-- Police Jacket / Blouse -->
    <path d="M 75 160 Q 120 152 165 160 L 170 225 Q 120 230 70 225 Z" fill="url(#uniformGrad)" filter="url(#softShadow)"/>

    <!-- Golden Belt & Buckle -->
    <rect x="74" y="208" width="92" height="12" rx="2" fill="#8D6E63"/>
    <rect x="110" y="206" width="20" height="16" rx="3" fill="url(#goldAcc)" stroke="#B45309" stroke-width="1.5"/>
    <circle cx="120" cy="214" r="3" fill="#B45309"/>

    <!-- Red Collar Epaulets (Cầu vai đỏ viền vàng) -->
    <polygon points="76,162 92,158 90,172 74,174" fill="#DC2626" stroke="url(#goldAcc)" stroke-width="1"/>
    <polygon points="164,162 148,158 150,172 166,174" fill="#DC2626" stroke="url(#goldAcc)" stroke-width="1"/>
    <circle cx="83" cy="165" r="2" fill="url(#goldAcc)"/>
    <circle cx="157" cy="165" r="2" fill="url(#goldAcc)"/>

    <!-- Tie & Collar -->
    <polygon points="112,160 128,160 125,188 120,195 115,188" fill="#144217"/>
    <polygon points="102,156 120,165 112,160" fill="#FFFFFF"/>
    <polygon points="138,156 120,165 128,160" fill="#FFFFFF"/>
    <!-- Gold buttons -->
    <circle cx="120" cy="178" r="3" fill="url(#goldAcc)"/>
    <circle cx="120" cy="192" r="3" fill="url(#goldAcc)"/>

    <!-- Left Hand Holding Law Tablet / Book -->
    <g transform="translate(42, 170) rotate(-10)">
      <rect x="0" y="0" width="36" height="48" rx="4" fill="#1E3A8A" stroke="url(#goldAcc)" stroke-width="2"/>
      <line x1="6" y1="12" x2="30" y2="12" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <line x1="6" y1="20" x2="26" y2="20" stroke="#93C5FD" stroke-width="2" stroke-linecap="round"/>
      <line x1="6" y1="28" x2="28" y2="28" stroke="#93C5FD" stroke-width="2" stroke-linecap="round"/>
      <!-- Star on tablet -->
      <polygon points="18,34 20,38 24,38 21,40 22,44 18,42 14,44 15,40 12,38 16,38" fill="url(#goldAcc)"/>
      <!-- Cute Hand holding -->
      <circle cx="28" cy="24" r="10" fill="#FFE0B2"/>
    </g>

    <!-- Right Arm & Pointing Hand (Thân thiện chào & chỉ dẫn) -->
    <path d="M 160 168 Q 185 175 195 160" stroke="url(#uniformGrad)" stroke-width="16" stroke-linecap="round" fill="none"/>
    <!-- Pointing Finger Hand -->
    <circle cx="196" cy="158" r="11" fill="#FFE0B2"/>
    <rect x="195" y="146" width="10" height="15" rx="5" fill="#FFE0B2" transform="rotate(-30 195 146)"/>
  </g>

  <!-- Big Cute Head -->
  <g id="headGroup" filter="url(#softShadow)">
    <!-- Ears -->
    <circle cx="58" cy="108" r="14" fill="#FFE0B2"/>
    <circle cx="58" cy="108" r="8" fill="#FFCC80"/>
    <circle cx="182" cy="108" r="14" fill="#FFE0B2"/>
    <circle cx="182" cy="108" r="8" fill="#FFCC80"/>

    <!-- Face Shape -->
    <ellipse cx="120" cy="108" rx="64" ry="54" fill="url(#faceGrad)"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="78" cy="122" rx="12" ry="7" fill="#F87171" opacity="0.45"/>
    <ellipse cx="162" cy="122" rx="12" ry="7" fill="#F87171" opacity="0.45"/>

    <!-- Big Expressive Chibi Eyes -->
    <g id="eyes">
      <!-- Left Eye -->
      <ellipse cx="92" cy="105" rx="14" ry="17" fill="#1F2937"/>
      <ellipse cx="88" cy="99" rx="6" ry="7" fill="#FFFFFF"/>
      <circle cx="97" cy="112" r="3.5" fill="#FFFFFF"/>
      <path d="M 80 88 Q 92 84 104 88" stroke="#374151" stroke-width="3" fill="none" stroke-linecap="round"/>

      <!-- Right Eye -->
      <ellipse cx="148" cy="105" rx="14" ry="17" fill="#1F2937"/>
      <ellipse cx="144" cy="99" rx="6" ry="7" fill="#FFFFFF"/>
      <circle cx="153" cy="112" r="3.5" fill="#FFFFFF"/>
      <path d="M 136 88 Q 148 84 160 88" stroke="#374151" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Cute Nose & Cheerful Smiling Mouth -->
    <ellipse cx="120" cy="115" rx="2.5" ry="2" fill="#E28743"/>
    <path d="M 108 124 Q 120 140 132 124" fill="#EF4444" stroke="#B91C1C" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 112 126 Q 120 134 128 126" fill="#FCA5A5"/>

    <!-- Hair Tuft Under Cap -->
    <path d="M 66 82 Q 78 92 90 85 Q 105 92 120 84 Q 135 92 150 85 Q 160 92 174 82 Z" fill="#2D231C"/>

    <!-- Police Service Cap (Mũ Kê-pi CAND) -->
    <!-- Cap Visor / Peak (Lưỡi trai đen bóng) -->
    <path d="M 52 74 Q 120 54 188 74 C 182 86, 58 86, 52 74 Z" fill="#18181B"/>
    <path d="M 68 76 Q 120 62 172 76" stroke="#52525B" stroke-width="2" fill="none"/>

    <!-- Cap Crown & Band (Thân mũ xanh & vành đỏ) -->
    <path d="M 60 72 Q 120 58 180 72 L 178 58 Q 120 46 62 58 Z" fill="#DC2626"/>
    <!-- Gold chin strap band -->
    <path d="M 58 71 Q 120 57 182 71" stroke="url(#goldAcc)" stroke-width="3" fill="none"/>

    <!-- Cap Top Crown -->
    <path d="M 45 48 C 50 15, 190 15, 195 48 C 175 62, 65 62, 45 48 Z" fill="url(#capGrad)"/>

    <!-- Cap Golden Piping (Viền vàng trên chóp mũ) -->
    <path d="M 50 44 C 70 22, 170 22, 190 44" stroke="url(#goldAcc)" stroke-width="2.5" fill="none"/>

    <!-- Cap Badge (Huy hiệu CAND mini trên mũ) -->
    <circle cx="120" cy="52" r="14" fill="#DC2626" stroke="url(#goldAcc)" stroke-width="2"/>
    <polygon points="120,44 122,49 127,49 123,52 125,57 120,54 115,57 117,52 113,49 118,49" fill="url(#goldAcc)"/>
  </g>
</svg>

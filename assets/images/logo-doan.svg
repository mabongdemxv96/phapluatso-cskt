<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="doanRedGrad" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="65%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </radialGradient>
    <linearGradient id="doanGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="doanGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <filter id="doanShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Border Circle -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="url(#doanGold)" stroke-width="6" filter="url(#doanShadow)"/>
  <circle cx="100" cy="100" r="86" fill="url(#doanGreenGrad)"/>

  <!-- Inner Badge Shape / Flag with Hand -->
  <circle cx="100" cy="100" r="76" fill="url(#doanRedGrad)" stroke="url(#doanGold)" stroke-width="3"/>

  <!-- Golden Waving Flag background contour -->
  <path d="M 50 50 Q 80 40 100 50 T 150 50 L 150 120 Q 120 110 100 120 T 50 120 Z" fill="#B91C1C" opacity="0.3"/>

  <!-- Star in the flag -->
  <polygon points="100,56 106,72 124,72 109,83 115,100 100,89 85,100 91,83 76,72 94,72" 
           fill="url(#doanGold)" stroke="#B45309" stroke-width="1"/>

  <!-- Strong Hand Holding Flagpole (Biểu tượng cánh tay nắm chặt ngọn cờ) -->
  <g fill="url(#doanGold)">
    <!-- Flagpole -->
    <rect x="58" y="38" width="6" height="110" rx="2" fill="url(#doanGold)" stroke="#B45309" stroke-width="0.5"/>
    <circle cx="61" cy="36" r="5" fill="url(#doanGold)"/>
    <!-- Arm and Hand -->
    <path d="M 40 148 C 50 135, 62 125, 75 120 L 78 126 C 68 132, 58 142, 48 152 Z"/>
    <ellipse cx="64" cy="122" rx="10" ry="8" transform="rotate(-20 64 122)"/>
    <ellipse cx="61" cy="116" rx="5" ry="5"/>
  </g>

  <!-- Bottom Ribbon with Text: THANH NIÊN VIỆT NAM -->
  <path d="M 32 142 Q 100 125 168 142 L 160 168 Q 100 152 40 168 Z" fill="#047857" stroke="url(#doanGold)" stroke-width="2.5"/>
  <path id="ribbonTextPath" d="M 36 156 Q 100 138 164 156" fill="none"/>
  <text font-size="9" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" fill="#FEF08A" letter-spacing="1.2">
    <textPath href="#ribbonTextPath" startOffset="50%" text-anchor="middle">
      THANH NIÊN VIỆT NAM
    </textPath>
  </text>
</svg>

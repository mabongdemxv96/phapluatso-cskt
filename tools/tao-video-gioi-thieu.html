<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tạo video giới thiệu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/webm-muxer@5.0.3/build/webm-muxer.min.js"></script>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #020617; color: #e2e8f0; font-family: Inter, system-ui, sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { color: #94a3b8; font-size: 14px; margin: 0 0 16px; line-height: 1.6; }
  canvas { width: 100%; height: auto; border-radius: 12px; border: 1px solid #1e293b; display: block; background: #061a33; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
  button { font: 700 14px Inter, sans-serif; padding: 10px 16px; border-radius: 10px; border: 0; cursor: pointer; background: #f59e0b; color: #1c1002; }
  button.secondary { background: #1e293b; color: #e2e8f0; }
  button:disabled { opacity: .5; cursor: wait; }
  #status { font-size: 13px; color: #fcd34d; }
  a { color: #fcd34d; }
</style>
</head>
<body>
<main>
  <h1>Tạo video giới thiệu công trình (≈21 giây, 1280×720)</h1>
  <p>Trang này vẽ hoạt họa bằng code rồi xuất thành file video. Muốn đổi chữ, màu hay thời lượng thì sửa phần <code>KỊCH BẢN</code> trong mã nguồn trang này, mở lại trang rồi bấm <strong>Xuất video</strong>. File tải về đặt vào <code>assets/video/</code>.</p>
  <canvas id="stage" width="1280" height="720"></canvas>
  <div class="row">
    <button id="btn-play" class="secondary">⏯ Xem thử / Tạm dừng</button>
    <button id="btn-export">⬇ Xuất video</button>
    <button id="btn-poster" class="secondary">🖼 Xuất ảnh bìa</button>
    <span id="status"></span>
  </div>
</main>

<script>
/* =====================================================================
   KỊCH BẢN – sửa nội dung tại đây
   ===================================================================== */
const SCRIPT = {
  unitTop: 'CÔNG AN TỈNH GIA LAI',
  unit: 'ĐOÀN CƠ SỞ PHÒNG CẢNH SÁT KINH TẾ',
  badge: 'CÔNG TRÌNH THANH NIÊN CHUYỂN ĐỔI SỐ',
  title1: 'KHÔNG GIAN PHÁP LUẬT SỐ',
  title2: '& TRỢ LÝ AI HỎI ĐÁP PHÁP LUẬT',
  titleSub: 'Tiên phong thực hiện Nghị quyết số 57-NQ/TW của Bộ Chính trị',
  f1: ['Giá sách 3D lật trang', 'Đọc trực tiếp văn bản pháp luật gốc như sách thật'],
  books: [['LUẬT XỬ LÝ VPHC', '#881337'], ['BỘ LUẬT HÌNH SỰ', '#1e3a8a'], ['CẨM NANG CSKT', '#065f46'], ['NGHỊ QUYẾT 57', '#991b1b']],
  f2: ['Tra cứu điều luật tức thì', 'Gõ số điều hoặc từ khóa, xem ngay toàn văn điều luật'],
  query: 'Điều 188 tội buôn lậu',
  resultLaw: 'Bộ luật Hình sự 2015',
  resultTitle: 'Điều 188. Tội buôn lậu',
  resultText: '1. Người nào buôn bán qua biên giới hoặc từ khu phi thuế quan vào nội địa hoặc ngược lại trái pháp luật hàng hóa, tiền Việt Nam, ngoại tệ…',
  f3: ['Trợ lý AI hỏi đáp 24/7', 'Trả lời ngắn gọn, đúng trọng tâm, nêu căn cứ pháp lý'],
  question: 'Thời hiệu xử phạt vi phạm hành chính là bao lâu?',
  answer: ['• Thông thường: 01 năm.', '• Một số lĩnh vực (kế toán, đất đai, xây dựng…): 02 năm.', 'Căn cứ: Điều 6 Luật Xử lý vi phạm hành chính.'],
  slogan: 'Bản lĩnh · Kỷ cương · Xung kích · Sáng tạo',
  outro: 'Không gian Pháp luật số – Đoàn cơ sở Phòng CSKT Công an tỉnh Gia Lai'
};

const W = 1280, H = 720, FPS = 30, DUR = 21;
const LOGO_SRC = '../assets/images/logo-cskt.png';

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
let logo = null;

/* ---------- Tiện ích ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, s, d) => clamp((t - s) / d);
const eOut = x => 1 - Math.pow(1 - x, 3);
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const rand = i => { const s = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); };
const scene = (t, s, e, fi = .45, fo = .45) => (t < s || t > e) ? 0 : Math.min(prog(t, s, fi), 1 - prog(t, e - fo, fo));
const FONT = (w, s) => `${w} ${s}px Inter, "Segoe UI", Arial, sans-serif`;

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function fitSize(str, size, weight, maxW) {
  let s = size;
  while (s > 10) { ctx.font = FONT(weight, s); if (ctx.measureText(str).width <= maxW) break; s -= 2; }
  return s;
}

function text(str, x, y, o = {}) {
  const { size = 40, weight = 800, color = '#fff', align = 'center', alpha = 1, maxW = 1180, letter = 0, shadow = false, gold = false } = o;
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  const s = fitSize(str, size, weight, maxW);
  ctx.font = FONT(weight, s);
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  if ('letterSpacing' in ctx) ctx.letterSpacing = letter + 'px';
  if (shadow) { ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 4; }
  if (gold) {
    const w = ctx.measureText(str).width;
    const x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
    const g = ctx.createLinearGradient(x0, 0, x0 + w, 0);
    g.addColorStop(0, '#fde68a'); g.addColorStop(.5, '#f59e0b'); g.addColorStop(1, '#fbbf24');
    ctx.fillStyle = g;
  } else ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function wrap(str, maxW, size, weight) {
  ctx.font = FONT(weight, size);
  const words = str.split(' ');
  const lines = [];
  let cur = '';
  words.forEach(w => {
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test;
  });
  if (cur) lines.push(cur);
  return lines;
}

function drawLogo(cx, cy, size, alpha = 1) {
  if (!logo || alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  const ratio = logo.width / logo.height;
  const w = ratio >= 1 ? size : size * ratio;
  const h = ratio >= 1 ? size / ratio : size;
  ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
  ctx.drawImage(logo, cx - w / 2, cy - h / 2, w, h);
  ctx.restore();
}

/* ---------- Nền chuyển động ---------- */
function drawBackground(t) {
  const g = ctx.createRadialGradient(W * .5, H * .35, 40, W * .5, H * .5, W * .85);
  g.addColorStop(0, '#173860'); g.addColorStop(.55, '#0a192f'); g.addColorStop(1, '#040b16');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Quầng sáng trôi
  const p = t / DUR;
  [[W * (.15 + .7 * p), H * .12, 'rgba(245,158,11,0.20)'], [W * (.85 - .7 * p), H * .95, 'rgba(37,99,235,0.28)']].forEach(([x, y, c]) => {
    const rg = ctx.createRadialGradient(x, y, 0, x, y, 520);
    rg.addColorStop(0, c); rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  });

  // Lưới chấm
  ctx.fillStyle = 'rgba(96,165,250,0.08)';
  for (let x = 12; x < W; x += 32) for (let y = 12; y < H; y += 32) ctx.fillRect(x, y, 2, 2);

  // Hạt sáng vàng
  for (let i = 0; i < 70; i++) {
    const sp = 6 + rand(i + 3) * 22;
    const x = (rand(i) * W + t * sp * .6) % W;
    const y = ((rand(i + 1) * H - t * sp) % H + H) % H;
    const tw = .25 + .45 * (0.5 + 0.5 * Math.sin(t * 2 + i));
    ctx.fillStyle = `rgba(252,211,77,${tw * .6})`;
    ctx.beginPath(); ctx.arc(x, y, 1 + rand(i + 2) * 2.2, 0, Math.PI * 2); ctx.fill();
  }

  // Thanh tiến độ
  ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(0, H - 5, W, 5);
  const pg = ctx.createLinearGradient(0, 0, W, 0);
  pg.addColorStop(0, '#f59e0b'); pg.addColorStop(1, '#fde68a');
  ctx.fillStyle = pg; ctx.fillRect(0, H - 5, W * p, 5);
}

function featureHeader(num, title, sub, lt, a) {
  const k = eOut(prog(lt, 0, .5));
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(-40 * (1 - k), 0);
  ctx.fillStyle = '#f59e0b';
  ctx.beginPath(); ctx.arc(110, 104, 34, 0, Math.PI * 2); ctx.fill();
  text(String(num), 110, 106, { size: 34, weight: 900, color: '#1c1002' });
  text(title, 166, 92, { size: 44, weight: 900, align: 'left', shadow: true });
  text(sub, 166, 140, { size: 24, weight: 600, align: 'left', color: '#a9c1e6', alpha: prog(lt, .3, .5) });
  ctx.restore();
}

/* ---------- Cảnh 1: Đơn vị ---------- */
function scene1(t) {
  const a = scene(t, 0, 4.2, .5);
  if (!a) return;
  ctx.save(); ctx.globalAlpha = a;
  const s = eBack(prog(t, .15, 1.0));
  // Vòng hào quang xoay
  ctx.save();
  ctx.translate(W / 2, 290);
  ctx.rotate(t * .8);
  ctx.strokeStyle = 'rgba(252,211,77,0.55)';
  ctx.lineWidth = 3;
  ctx.setLineDash([18, 14]);
  ctx.beginPath(); ctx.arc(0, 0, 170 * s, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
  const glow = ctx.createRadialGradient(W / 2, 290, 0, W / 2, 290, 220);
  glow.addColorStop(0, 'rgba(245,158,11,0.35)'); glow.addColorStop(1, 'rgba(245,158,11,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  drawLogo(W / 2, 290, 270 * s);

  const k1 = eOut(prog(t, 1.2, .6)), k2 = eOut(prog(t, 1.55, .6));
  text(SCRIPT.unitTop, W / 2, 512 + 20 * (1 - k1), { size: 26, weight: 800, color: '#fcd34d', letter: 5, alpha: k1 });
  text(SCRIPT.unit, W / 2, 562 + 20 * (1 - k2), { size: 46, weight: 900, alpha: k2, shadow: true });
  const lw = 420 * eInOut(prog(t, 1.9, .8));
  ctx.fillStyle = '#f59e0b'; ctx.fillRect(W / 2 - lw / 2, 606, lw, 4);
  ctx.restore();
}

/* ---------- Cảnh 2: Tên công trình ---------- */
function scene2(t) {
  const a = scene(t, 4, 8.1);
  if (!a) return;
  const lt = t - 4;
  ctx.save(); ctx.globalAlpha = a;
  // Nhãn
  const kb = eOut(prog(lt, .1, .5));
  ctx.save();
  ctx.globalAlpha *= kb;
  ctx.font = FONT(800, 22);
  if ('letterSpacing' in ctx) ctx.letterSpacing = '3px';
  const bw = ctx.measureText(SCRIPT.badge).width + 64;
  rr(W / 2 - bw / 2, 190, bw, 50, 25);
  ctx.fillStyle = 'rgba(30,58,138,0.55)'; ctx.fill();
  ctx.strokeStyle = 'rgba(252,211,77,0.7)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
  text(SCRIPT.badge, W / 2, 216, { size: 22, weight: 800, color: '#fcd34d', letter: 3, alpha: kb });

  const k1 = eOut(prog(lt, .35, .7)), k2 = eOut(prog(lt, .75, .7));
  text(SCRIPT.title1, W / 2, 322 + 40 * (1 - k1), { size: 74, weight: 900, alpha: k1, shadow: true });
  text(SCRIPT.title2, W / 2, 412 + 40 * (1 - k2), { size: 62, weight: 900, alpha: k2, gold: true, shadow: true });

  // Vệt sáng quét qua tiêu đề
  const sx = -300 + (W + 600) * prog(lt, 1.5, 1.1);
  if (lt > 1.5 && lt < 2.6) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const sg = ctx.createLinearGradient(sx - 120, 0, sx + 120, 0);
    sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(.5, 'rgba(255,255,255,0.18)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sg; ctx.fillRect(0, 270, W, 190);
    ctx.restore();
  }
  text(SCRIPT.titleSub, W / 2, 506, { size: 28, weight: 600, color: '#c7d6ee', alpha: prog(lt, 1.2, .6) });
  ctx.restore();
}

/* ---------- Cảnh 3: Giá sách 3D ---------- */
function drawBook(x, y, w, h, color, label, a) {
  ctx.save();
  ctx.globalAlpha *= a;
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 20; ctx.shadowOffsetX = -6; ctx.shadowOffsetY = 8;
  rr(x, y, w, h, 8);
  ctx.fillStyle = color; ctx.fill();
  ctx.restore();
  ctx.save(); ctx.globalAlpha *= a;
  const sg = ctx.createLinearGradient(x, 0, x + 18, 0);
  sg.addColorStop(0, 'rgba(255,255,255,.35)'); sg.addColorStop(1, 'rgba(0,0,0,.25)');
  ctx.fillStyle = sg; ctx.fillRect(x, y + 4, 18, h - 8);
  ctx.fillStyle = '#fbbf24'; ctx.fillRect(x + 28, y + 18, 48, 14);
  const lines = wrap(label, w - 40, 15, 900);
  lines.slice(0, 3).forEach((l, i) => text(l, x + 28, y + 74 + i * 20, { size: 15, weight: 900, color: '#fde68a', align: 'left', maxW: w - 36 }));
  ctx.fillStyle = '#fbbf24'; ctx.fillRect(x + 28, y + 74 + Math.min(3, lines.length) * 20, 30, 3);
  ctx.restore();
}

function drawOpenBook(cx, cy, pw, ph, lt, a) {
  ctx.save();
  ctx.globalAlpha *= a;
  ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18;
  ctx.fillStyle = '#e2e8f0';
  rr(cx - pw - 10, cy - ph / 2 - 8, pw * 2 + 20, ph + 16, 10); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.globalAlpha *= a;
  const page = (x, flip) => {
    ctx.fillStyle = '#fbfbf7'; ctx.fillRect(x, cy - ph / 2, pw, ph);
    ctx.fillStyle = '#b91c1c'; ctx.fillRect(x + 28, cy - ph / 2 + 30, pw * .5, 10);
    for (let i = 0; i < 11; i++) {
      ctx.fillStyle = i % 4 === 0 ? '#1e3a8a' : '#cbd5e1';
      ctx.fillRect(x + 28, cy - ph / 2 + 62 + i * 22, (pw - 56) * (i % 4 === 3 ? .6 : 1), 7);
    }
  };
  page(cx - pw, false); page(cx, false);
  // Nếp gáy
  const cg = ctx.createLinearGradient(cx - 30, 0, cx + 30, 0);
  cg.addColorStop(0, 'rgba(0,0,0,0)'); cg.addColorStop(.5, 'rgba(0,0,0,.22)'); cg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = cg; ctx.fillRect(cx - 30, cy - ph / 2, 60, ph);

  // Trang đang lật
  [2.35, 3.05].forEach(st => {
    const f = eInOut(prog(lt, st, .7));
    if (f <= 0 || f >= 1) return;
    const wv = pw * Math.cos(Math.PI * f);
    const x = wv >= 0 ? cx : cx + wv;
    const ww = Math.abs(wv);
    ctx.fillStyle = wv >= 0 ? '#ffffff' : '#f1f5f9';
    ctx.fillRect(x, cy - ph / 2 - 4, ww, ph + 8);
    const sh = ctx.createLinearGradient(x, 0, x + ww, 0);
    sh.addColorStop(0, wv >= 0 ? 'rgba(0,0,0,.18)' : 'rgba(0,0,0,0)');
    sh.addColorStop(1, wv >= 0 ? 'rgba(0,0,0,0)' : 'rgba(0,0,0,.18)');
    ctx.fillStyle = sh; ctx.fillRect(x, cy - ph / 2 - 4, ww, ph + 8);
  });
  ctx.restore();
}

function scene3(t) {
  const a = scene(t, 8, 12.1);
  if (!a) return;
  const lt = t - 8;
  ctx.save(); ctx.globalAlpha = a;

  // Kệ gỗ
  const shelfY = 600;
  const wg = ctx.createLinearGradient(0, shelfY, 0, shelfY + 26);
  wg.addColorStop(0, '#a0682f'); wg.addColorStop(1, '#4a2a0f');
  ctx.fillStyle = wg; rr(200, shelfY, 880, 26, 4); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(220, shelfY + 26, 840, 10);

  const bw = 150, bh = 220, gap = 46;
  const startX = W / 2 - (SCRIPT.books.length * bw + (SCRIPT.books.length - 1) * gap) / 2;
  SCRIPT.books.forEach(([label, color], i) => {
    const k = eBack(prog(lt, .3 + i * .15, .6));
    const y = shelfY - bh - 260 * (1 - k);
    drawBook(startX + i * (bw + gap), y, bw, bh, color, label, prog(lt, .3 + i * .15, .25));
  });

  // Mở sách
  const ko = eOut(prog(lt, 1.8, .5));
  if (ko > 0) {
    ctx.fillStyle = `rgba(2,6,23,${.55 * ko})`; ctx.fillRect(0, 0, W, H - 5);
    ctx.save();
    ctx.translate(W / 2, 410);
    ctx.scale(.7 + .3 * ko, .7 + .3 * ko);
    ctx.translate(-W / 2, -410);
    drawOpenBook(W / 2, 410, 270, 360, lt, ko);
    ctx.restore();
  }
  featureHeader(1, SCRIPT.f1[0], SCRIPT.f1[1], lt, 1);
  ctx.restore();
}

/* ---------- Cảnh 4: Tra cứu ---------- */
function drawMagnifier(x, y, s, color) {
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = s * .18; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(x, y, s * .38, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + s * .28, y + s * .28); ctx.lineTo(x + s * .55, y + s * .55); ctx.stroke();
  ctx.restore();
}

function scene4(t) {
  const a = scene(t, 12, 16.1);
  if (!a) return;
  const lt = t - 12;
  ctx.save(); ctx.globalAlpha = a;
  featureHeader(2, SCRIPT.f2[0], SCRIPT.f2[1], lt, 1);

  const kb = eOut(prog(lt, .15, .5));
  const bx = 220, by = 220 + 30 * (1 - kb), bw = 840, bh = 84;
  ctx.save(); ctx.globalAlpha *= kb;
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
  rr(bx, by, bw, bh, 42); ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.restore();
  ctx.save(); ctx.globalAlpha *= kb;
  rr(bx, by, bw, bh, 42); ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 4; ctx.stroke();
  drawMagnifier(bx + 48, by + bh / 2 - 4, 34, '#d97706');
  const n = Math.floor(prog(lt, .55, 1.2) * SCRIPT.query.length);
  const typed = SCRIPT.query.slice(0, n);
  text(typed, bx + 86, by + bh / 2 + 1, { size: 32, weight: 600, color: '#0f172a', align: 'left' });
  ctx.font = FONT(600, 32);
  const cw = ctx.measureText(typed).width;
  if (Math.floor(lt * 2.5) % 2 === 0 && lt < 2.2) { ctx.fillStyle = '#d97706'; ctx.fillRect(bx + 88 + cw, by + 24, 3, 36); }
  const pressed = lt > 1.85 && lt < 2.05 ? .94 : 1;
  ctx.save();
  ctx.translate(bx + bw - 95, by + bh / 2); ctx.scale(pressed, pressed);
  rr(-80, -28, 160, 56, 28); ctx.fillStyle = '#f59e0b'; ctx.fill();
  text('Tra cứu →', 0, 1, { size: 24, weight: 800, color: '#1c1002' });
  ctx.restore();
  ctx.restore();

  // Thẻ kết quả
  const kr = eOut(prog(lt, 2.05, .55));
  if (kr > 0) {
    const cx = 220, cy = 350 + 50 * (1 - kr), cw2 = 840, ch = 270;
    ctx.save(); ctx.globalAlpha *= kr;
    ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 12;
    rr(cx, cy, cw2, ch, 18); ctx.fillStyle = 'rgba(15,23,42,0.95)'; ctx.fill();
    ctx.restore();
    ctx.save(); ctx.globalAlpha *= kr;
    rr(cx, cy, cw2, ch, 18); ctx.strokeStyle = 'rgba(252,211,77,0.5)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#10b981'; ctx.fillRect(cx, cy + 18, 6, ch - 36);
    // Nhãn
    ctx.font = FONT(800, 18);
    const lw1 = ctx.measureText(SCRIPT.resultLaw).width + 28;
    rr(cx + 32, cy + 24, lw1, 34, 8); ctx.fillStyle = 'rgba(37,99,235,0.35)'; ctx.fill();
    text(SCRIPT.resultLaw, cx + 46, cy + 42, { size: 18, weight: 800, color: '#93c5fd', align: 'left' });
    ctx.font = FONT(800, 18);
    const lw2 = ctx.measureText('Văn bản gốc').width + 28;
    rr(cx + 44 + lw1, cy + 24, lw2, 34, 8); ctx.fillStyle = 'rgba(16,185,129,0.25)'; ctx.fill();
    text('Văn bản gốc', cx + 58 + lw1, cy + 42, { size: 18, weight: 800, color: '#6ee7b7', align: 'left' });
    text(SCRIPT.resultTitle, cx + 32, cy + 92, { size: 34, weight: 900, color: '#fcd34d', align: 'left' });
    const lines = wrap(SCRIPT.resultText, cw2 - 70, 24, 400);
    lines.slice(0, 3).forEach((l, i) => {
      const lk = prog(lt, 2.4 + i * .15, .3);
      text(l, cx + 32, cy + 142 + i * 36, { size: 24, weight: 400, color: '#e2e8f0', align: 'left', alpha: lk, maxW: cw2 - 64 });
    });
    ctx.restore();
  }
  ctx.restore();
}

/* ---------- Cảnh 5: Trợ lý AI ---------- */
function bubble(x, y, maxW, lines, size, bg, fg, align, a, weight = 600) {
  ctx.font = FONT(weight, size);
  const lh = size * 1.45;
  const w = Math.min(maxW, Math.max(...lines.map(l => ctx.measureText(l).width)) + 44);
  const h = lines.length * lh + 30;
  const bx = align === 'right' ? x - w : x;
  ctx.save(); ctx.globalAlpha *= a;
  ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 6;
  rr(bx, y, w, h, 20); ctx.fillStyle = bg; ctx.fill();
  ctx.restore();
  ctx.save(); ctx.globalAlpha *= a;
  lines.forEach((l, i) => text(l, bx + 22, y + 15 + lh / 2 + i * lh, { size, weight, color: fg, align: 'left', maxW: maxW - 40 }));
  ctx.restore();
  return h;
}

function scene5(t) {
  const a = scene(t, 16, 19.3);
  if (!a) return;
  const lt = t - 16;
  ctx.save(); ctx.globalAlpha = a;
  featureHeader(3, SCRIPT.f3[0], SCRIPT.f3[1], lt, 1);

  const kp = eOut(prog(lt, .1, .5));
  const px = 250, py = 200 + 30 * (1 - kp), pw = 780, ph = 440;
  ctx.save(); ctx.globalAlpha *= kp;
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 14;
  rr(px, py, pw, ph, 26); ctx.fillStyle = 'rgba(15,23,42,0.94)'; ctx.fill();
  ctx.restore();
  ctx.save(); ctx.globalAlpha *= kp;
  rr(px, py, pw, ph, 26); ctx.strokeStyle = 'rgba(252,211,77,0.8)'; ctx.lineWidth = 3; ctx.stroke();
  // Đầu khung chat
  ctx.save(); rr(px, py, pw, 70, 26); ctx.clip();
  const hg = ctx.createLinearGradient(px, 0, px + pw, 0);
  hg.addColorStop(0, '#0b2545'); hg.addColorStop(1, '#172554');
  ctx.fillStyle = hg; ctx.fillRect(px, py, pw, 70);
  ctx.restore();
  drawLogo(px + 46, py + 35, 46);
  text('TRỢ LÝ PHÁP LUẬT SỐ', px + 84, py + 27, { size: 22, weight: 900, color: '#fcd34d', align: 'left' });
  ctx.fillStyle = '#34d399'; ctx.beginPath(); ctx.arc(px + 90, py + 51, 5, 0, Math.PI * 2); ctx.fill();
  text('Đang trực tuyến 24/7', px + 102, py + 51, { size: 16, weight: 600, color: '#bfdbfe', align: 'left' });
  ctx.restore();

  // Câu hỏi
  const kq = eOut(prog(lt, .45, .4));
  const qLines = wrap(SCRIPT.question, 420, 22, 600);
  bubble(px + pw - 28, py + 92 + 16 * (1 - kq), 460, qLines, 22, '#1d4ed8', '#ffffff', 'right', kq);

  // Đang soạn
  if (lt > 1.0 && lt < 1.6) {
    const dy = py + 210;
    ctx.save(); rr(px + 92, dy, 92, 46, 23); ctx.fillStyle = '#1e293b'; ctx.fill(); ctx.restore();
    for (let i = 0; i < 3; i++) {
      const b = Math.sin(lt * 12 - i * .9) * 5;
      ctx.fillStyle = '#fbbf24'; ctx.beginPath(); ctx.arc(px + 118 + i * 20, dy + 23 - Math.max(0, b), 6, 0, Math.PI * 2); ctx.fill();
    }
    drawLogo(px + 56, dy + 23, 44);
  }

  // Trả lời
  const ka = eOut(prog(lt, 1.6, .35));
  if (ka > 0) {
    const ay = py + 206;
    drawLogo(px + 56, ay + 26, 44, ka);
    const full = SCRIPT.answer.join('\n');
    const shown = full.slice(0, Math.floor(prog(lt, 1.65, .85) * full.length));
    const lines = [];
    shown.split('\n').forEach(seg => wrap(seg || ' ', 560, 22, 600).forEach(l => lines.push(l)));
    const allLines = [];
    full.split('\n').forEach(seg => wrap(seg, 560, 22, 600).forEach(l => allLines.push(l)));
    // Kích thước khung theo toàn bộ nội dung để không bị giật
    ctx.font = FONT(600, 22);
    const lh = 22 * 1.45;
    const w = Math.max(...allLines.map(l => ctx.measureText(l).width)) + 44;
    const h = allLines.length * lh + 30;
    ctx.save(); ctx.globalAlpha *= ka;
    ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 6;
    rr(px + 92, ay, w, h, 20); ctx.fillStyle = '#1e293b'; ctx.fill();
    ctx.restore();
    ctx.save(); ctx.globalAlpha *= ka;
    rr(px + 92, ay, w, h, 20); ctx.strokeStyle = 'rgba(148,163,184,0.25)'; ctx.lineWidth = 1.5; ctx.stroke();
    lines.forEach((l, i) => {
      const isRef = l.startsWith('Căn cứ');
      text(l, px + 114, ay + 15 + lh / 2 + i * lh, { size: 22, weight: isRef ? 800 : 600, color: isRef ? '#fcd34d' : '#e2e8f0', align: 'left', maxW: 600 });
    });
    ctx.restore();
  }
  ctx.restore();
}

/* ---------- Cảnh 6: Kết ---------- */
function scene6(t) {
  const a = scene(t, 19.1, DUR, .45, .5);
  if (!a) return;
  const lt = t - 19.1;
  ctx.save(); ctx.globalAlpha = a;
  const s = eBack(prog(lt, .05, .7));
  const glow = ctx.createRadialGradient(W / 2, 250, 0, W / 2, 250, 200);
  glow.addColorStop(0, 'rgba(245,158,11,0.35)'); glow.addColorStop(1, 'rgba(245,158,11,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  drawLogo(W / 2, 250, 230 * s);
  const k1 = eOut(prog(lt, .35, .5)), k2 = eOut(prog(lt, .6, .5));
  text(SCRIPT.slogan, W / 2, 448 + 20 * (1 - k1), { size: 44, weight: 900, gold: true, alpha: k1, shadow: true });
  text(SCRIPT.outro, W / 2, 512 + 20 * (1 - k2), { size: 26, weight: 600, color: '#dbeafe', alpha: k2 });
  ctx.restore();
}

function drawFrame(t) {
  ctx.save();
  ctx.clearRect(0, 0, W, H);
  drawBackground(t);
  scene1(t); scene2(t); scene3(t); scene4(t); scene5(t); scene6(t);
  ctx.restore();
}

/* ---------- Tải tài nguyên ---------- */
async function loadAssets() {
  await Promise.all([
    document.fonts.load(FONT(900, 40), 'ĐƠNGIANPHÁPLUẬTSỐỆỞỨ'),
    document.fonts.load(FONT(800, 40), 'ĐƠNGIANPHÁPLUẬTSỐỆỞỨ'),
    document.fonts.load(FONT(600, 40), 'Thời hiệu xử phạt Đ'),
    document.fonts.load(FONT(400, 40), 'Người nào buôn bán Đ')
  ]).catch(() => {});
  logo = new Image();
  logo.src = LOGO_SRC;
  await logo.decode();
}

/* ---------- Xem thử ---------- */
let playing = false, startAt = 0, pausedAt = 0;
function loop(now) {
  if (!playing) return;
  const t = ((now - startAt) / 1000) % DUR;
  drawFrame(t);
  requestAnimationFrame(loop);
}
function play() { playing = true; startAt = performance.now() - pausedAt * 1000; requestAnimationFrame(loop); }
function pause() { playing = false; pausedAt = ((performance.now() - startAt) / 1000) % DUR; }

/* ---------- Xuất video (WebCodecs, dựng từng khung hình nên không phụ thuộc tốc độ máy) ---------- */
const yieldTask = () => new Promise(r => { const c = new MessageChannel(); c.port1.onmessage = () => r(); c.port2.postMessage(0); });

async function pickEncoder() {
  const candidates = [
    { codec: 'avc1.4d0028', mux: 'mp4' },
    { codec: 'avc1.42001f', mux: 'mp4' },
    { codec: 'vp09.00.10.08', mux: 'webm', muxCodec: 'V_VP9' },
    { codec: 'vp8', mux: 'webm', muxCodec: 'V_VP8' }
  ];
  for (const c of candidates) {
    const cfg = { codec: c.codec, width: W, height: H, bitrate: 2_000_000, framerate: FPS };
    if (c.mux === 'mp4') cfg.avc = { format: 'avc' };
    try {
      const s = await VideoEncoder.isConfigSupported(cfg);
      if (s.supported) return { ...c, cfg };
    } catch (e) { /* thử codec khác */ }
  }
  throw new Error('Trình duyệt không hỗ trợ mã hóa video (cần Chrome/Edge bản mới)');
}

async function renderVideo(onProgress = () => {}) {
  pause();
  const enc = await pickEncoder();
  const muxer = enc.mux === 'mp4'
    ? new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: 'avc', width: W, height: H }, fastStart: 'in-memory' })
    : new WebMMuxer.Muxer({ target: new WebMMuxer.ArrayBufferTarget(), video: { codec: enc.muxCodec, width: W, height: H, frameRate: FPS } });
  let failure = null;
  const encoder = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: e => { failure = e; } });
  encoder.configure(enc.cfg);
  const total = DUR * FPS;
  for (let i = 0; i < total; i++) {
    if (failure) throw failure;
    drawFrame(i / FPS);
    // Lấy điểm ảnh trực tiếp từ canvas (ổn định cả khi tab chạy nền)
    const pixels = ctx.getImageData(0, 0, W, H).data;
    const frame = new VideoFrame(pixels, { format: 'RGBA', codedWidth: W, codedHeight: H, timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
    encoder.encode(frame, { keyFrame: i % (FPS * 2) === 0 });
    frame.close();
    if (encoder.encodeQueueSize > 6) await yieldTask();
    if (i % 15 === 0) { onProgress(i / total); await yieldTask(); }
  }
  await encoder.flush();
  encoder.close();
  muxer.finalize();
  onProgress(1);
  const type = enc.mux === 'mp4' ? 'video/mp4' : 'video/webm';
  return { blob: new Blob([muxer.target.buffer], { type }), ext: enc.mux, codec: enc.codec };
}

async function renderPoster(t = 6.2) {
  drawFrame(t);
  return new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.86));
}

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

window.VideoMaker = { renderVideo, renderPoster, drawFrame, DUR };

/* ---------- Giao diện ---------- */
const statusEl = document.getElementById('status');
document.getElementById('btn-play').onclick = () => playing ? pause() : play();
document.getElementById('btn-export').onclick = async (e) => {
  e.target.disabled = true;
  try {
    const { blob, ext } = await renderVideo(p => statusEl.textContent = `Đang dựng video… ${Math.round(p * 100)}%`);
    download(blob, `gioi-thieu.${ext}`);
    statusEl.textContent = `Xong: gioi-thieu.${ext} (${(blob.size / 1048576).toFixed(1)} MB). Đặt file vào assets/video/`;
  } catch (err) {
    statusEl.textContent = 'Lỗi: ' + err.message;
  }
  e.target.disabled = false;
};
document.getElementById('btn-poster').onclick = async () => {
  download(await renderPoster(), 'gioi-thieu-poster.jpg');
};

loadAssets().then(() => { drawFrame(6.2); window.VideoMakerReady = true; if (!new URLSearchParams(location.search).has('noplay')) play(); });
</script>
